<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brand" x1="250" y1="330" x2="780" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="300" cy="240" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.30"/>
      <stop offset="0.7" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="780" cy="860" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="0.7" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- dark tile + brand glows — mirrors the app background -->
  <rect width="1024" height="1024" fill="#07060b"/>
  <rect width="1024" height="1024" fill="url(#glowA)"/>
  <rect width="1024" height="1024" fill="url(#glowB)"/>
  <!-- WUD "W" wordmark in the brand gradient -->
  <polyline points="250,330 420,694 512,500 604,694 774,330"
    fill="none" stroke="url(#brand)" stroke-width="118"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
