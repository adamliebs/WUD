name: Deploy

# Continuous deployment for the backend. On every push to `production` the
# image is verified, built, published to GitHub Container Registry, and the
# host is asked to redeploy.
on:
  push:
    branches: [production]
  workflow_dispatch:

# Never let two production deploys overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Build & publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Release to host
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger host redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering host redeploy…"
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
            echo "Done — host is pulling the new image."
          else
            echo "::notice::No DEPLOY_HOOK_URL secret set."
            echo "The image is published to ghcr.io/${{ github.repository }}-server:latest"
            echo "Point your host (Fly.io, Railway, Render, Coolify, a VPS, …) at that"
            echo "tag, or add a DEPLOY_HOOK_URL repository secret to auto-redeploy."
          fi
