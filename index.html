<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale + user-scalable=no disable pinch and double-tap zoom inside the
         Capacitor WKWebView. Mobile Safari ignores these flags for accessibility, but
         WKWebView (which is what the native shell runs) honors them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060b" />
